<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AnyLM API Tester</title>
    <style>
        :root {
            --bg: #0a0a0a;
            --panel: #141414;
            --accent: #fff;
            --text: #e0e0e0;
            --muted: #888;
        }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .card {
            background: var(--panel);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 32px;
            border-radius: 20px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
        }
        h1 { margin: 0 0 8px 0; font-size: 24px; color: var(--accent); }
        p { margin: 0 0 24px 0; font-size: 14px; color: var(--muted); }
        .input-group { margin-bottom: 20px; }
        label { display: block; font-size: 12px; font-weight: 600; text-transform: uppercase; margin-bottom: 8px; color: var(--muted); }
        input, select, textarea {
            width: 100%;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 12px;
            border-radius: 8px;
            color: #fff;
            box-sizing: border-box;
            font-size: 14px;
        }
        button {
            width: 100%;
            background: var(--accent);
            color: #000;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.1s;
        }
        button:active { transform: scale(0.98); }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        #response {
            margin-top: 24px;
            padding: 16px;
            background: rgba(0,0,0,0.3);
            border-radius: 8px;
            font-size: 13px;
            white-space: pre-wrap;
            display: none;
            border-left: 3px solid var(--accent);
            max-height: 200px;
            overflow-y: auto;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>AnyLM API Tester</h1>
        <p>Testing endpoint: http://localhost:8787/v1/chat/completions</p>

        <div class="input-group">
            <label>API Key</label>
            <input type="text" id="apiKey" value="any-hagafo9tdi45">
        </div>

        <div class="input-group">
            <label>Model</label>
            <select id="model">
                <option value="gpt-5.4">gpt-5.4 (GPTo)</option>
                <option value="gemini-3.1-pro-preview">gemini-3.1-pro-preview</option>
                <option value="claude-sonnet-4.6">claude-sonnet-4.6</option>
                <option value="deepseek-v3.2">deepseek-v3.2</option>
            </select>
        </div>

        <div class="input-group">
            <label>Message</label>
            <textarea id="message" rows="3">Hello! Tell me a joke.</textarea>
        </div>

        <button id="testBtn">Send Request</button>

        <div id="response"></div>
    </div>

    <script>
        const btn = document.getElementById('testBtn');
        const resp = document.getElementById('response');

        btn.onclick = async () => {
            const key = document.getElementById('apiKey').value;
            const model = document.getElementById('model').value;
            const msg = document.getElementById('message').value;

            btn.disabled = true;
            btn.innerText = 'Sending...';
            resp.style.display = 'block';
            resp.innerText = 'Waiting for response...';

            try {
                const response = await fetch('http://localhost:8787/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${key}`
                    },
                    body: JSON.stringify({
                        model: model,
                        messages: [{ role: 'user', content: msg }],
                        stream: false
                    })
                });

                const data = await response.json();
                if (response.ok) {
                    resp.innerText = data.choices[0].message.content;
                } else {
                    resp.innerText = 'Error: ' + (data.error?.message || response.statusText);
                    resp.style.borderLeftColor = '#ff4d4d';
                }
            } catch (err) {
                resp.innerText = 'Network Error: ' + err.message;
                resp.style.borderLeftColor = '#ff4d4d';
            } finally {
                btn.disabled = false;
                btn.innerText = 'Send Request';
            }
        };
    </script>
</body>
</html>
